# 遗留副本：2026-11-20 的 deploy 版 nginx 配置，证书/口令文件路径已替换为占位符。
# 权威模板见 docs/nginx/dsh-web.conf（2026-11-21 从 /etc/nginx 重新生成）。
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8443 ssl;
    server_name 8.134.170.38;

    ssl_certificate     /etc/nginx/tls/__TLS_CERT__;
    ssl_certificate_key /etc/nginx/tls/__TLS_KEY__;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;

    # 浏览器把 "8.134.170.38:8443" 当 http:// 发过来时 nginx 记 497，
    # 用 301 导到 https://，省得手打 scheme。
    error_page 497 =301 https://$host:$server_port$request_uri;

    # 长连接/流式响应
    proxy_http_version 1.1;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host       $http_host;
    proxy_set_header X-Real-IP  $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout  3600s;
    proxy_send_timeout  3600s;
    proxy_buffering     off;

    client_max_body_size 512m;

    # 不再加 auth_basic：DSH 自己有每次重启轮换的 token 作为唯一凭据。
    # 想恢复 Basic 鉴权：在 location 里加回
    #   auth_basic "DSH";
    #   auth_basic_user_file /etc/nginx/__HTPASSWD_FILE__;
    location / {
        proxy_pass http://127.0.0.1:42443;
    }
}
