# dsh-agent-hub — bundle patch layer (protocol dsh-agent/2.0, docs/DSH-HUB-PROTOCOL-v2.md)
#
# This DSH is a CONTROLLER of the standalone dsh-hub service (services/dsh-hub,
# port 7891, see services/dsh-hub/README.md). The hub owns tasks, leases, retries
# and artifacts; this plugin keeps no task state and runs no sweeper. Workers
# (AWS Quick, Claude Code, Kiro, ...) connect to the hub directly, never to DSH.
#
#   host-agent-hub        the 11 DSH-only control tools (-> hub /v1/ctl/*) and the
#                         login-guarded read-only panel routes /api/agent-hub/admin/*
#                         (forwarded to the hub, same paths and fields as v1)
#   client-ui-agent-hub   the read-only "Agent" tab of the router-b task board (falls back to a Sidebar
#                         row + full page only when router-b is not loaded); its
#                         host half is empty. lib/client.js must be built on the server:
#                         node packages/client-ui-agent-hub/scripts/build-client.mjs
#
# Tools (registered for DSH only):
#   agent_provision / agent_revoke / agent_list
#   agent_requests / agent_approve / agent_reject      (enrollment: worker asks, a controller decides)
#   task_dispatch / task_list / task_get / task_cancel / task_retry
#
# HTTP on the DSH web server (DSH login, GET only):
#   /api/agent-hub/admin/overview | agents | tasks?status=&agent=&limit= | task?task_id= | requests?status=
#   hub down / refused / TLS error / timeout  -> 503 {error:{code:"hub-unreachable"}}
#   hub refuses the controller token           -> 502 {error:{code:"hub-unauthorized"}}
#
# ---------------------------------------------------------------------------------------
# config (host-agent-hub)
#
# 默认什么都不用在这里写：连接配置全部放在 <DSH home>/agent-hub/controller.env
# （DSH home = $DSH_HOME 或 ~/.dsh，例如 C:\Users\<you>\.dsh\agent-hub\controller.env、
# /root/.dsh/agent-hub/controller.env），换机器只改这一个文件。模板见插件根目录的
# controller.env.example。controller.env 每次调用都重新读取，改完不用重启 DSH。
#
#   setting        controller.env / 环境变量     含义                                   默认
#   hubUrl         DSH_HUB_URL                 hub 地址；裸地址 8.134.170.38 会补成        无（必填）
#                                              https://8.134.170.38:7891；http:// 只允许
#                                              127.0.0.1 / localhost / [::1]；不能带账号密码、
#                                              query、fragment；结尾的 /v1 会被去掉
#   controllerId   DSH_HUB_CONTROLLER_ID       本 DSH 在 hub 上的控制方 id，                无（必填）
#                                              /^[a-z][a-z0-9-]{1,47}$/，如 dsh-local / dsh-cloud
#   proxy          DSH_HUB_PROXY               off/direct/none = 直连；env = 用 HTTPS_PROXY 等  直连
#                                              环境变量；http://host:port = 固定 HTTP 代理
#                                              （MYDESK: http://127.0.0.1:7890，Clash/mihomo）
#   caFile         DSH_HUB_CAFILE              自签证书时 hub 证书 / CA 的 PEM 路径           系统 CA
#   (token)        DSH_HUB_TOKEN               控制方令牌，在 hub 机器上                     无
#                                              node server.mjs controller add <controllerId>
#
# 优先级（每一项单独计算，启动日志里会写出每项来自哪里，令牌只写来源不写值）：
#   1. 本文件 / profile 层 cordis.patch.yml 里显式写的 config
#   2. DSH 进程的环境变量（DSH_HUB_URL ...）
#   3. envFile（默认 <DSH home>/agent-hub/controller.env）
#   4. 默认值
# 如果这里写了某一项，controller.env 里同名的那一项就不再生效，日志会提醒
# “controller.env 里的 X 被 cordis.patch.yml 覆盖了”。所以本 bundle 层故意不写
# hubUrl / controllerId。
#
# 只有在确实需要时，才在 profile 层的 cordis.patch.yml 里覆盖，例如：
#   - id: host-agent-hub
#     config:
#       hubUrl: https://127.0.0.1:7891      # 盖过 controller.env 的 DSH_HUB_URL
#       controllerId: dsh-cloud
#
# 其余只能在这里设置的键（都有默认值）：
#   timeoutMs     每个请求的超时，整数 1000..120000。默认 15000（非法值告警后用默认）。
#   tokenEnv      令牌变量名（同时用于进程环境和 envFile）。默认 DSH_HUB_TOKEN。
#   envFile       .env 格式的配置文件。默认 <DSH home>/agent-hub/controller.env。
#                 警告：永远不要指向 <DSH home>/.env，也不要把任何 DSH_ 开头的变量写进
#                 <DSH home>/.env —— 那是 DSH 自己的凭据文件，出现 DSH_ 变量 DSH 会拒绝启动。
#                 envFile 指向它时插件不会从中读取任何 DSH_ 变量，并在日志里提示迁移。
#
# 代理细节：Node 的 https.request 不读 HTTPS_PROXY，所以插件自己先对代理发
# CONNECT <hub>:<port>，再在隧道里和 hub 做 TLS（校验主机名，caFile 生效），令牌只在
# 这条 TLS 隧道里传输。只支持 http:// 代理（http://user:pass@h:p 会发 Basic 认证，凭据
# 不进日志），不支持 SOCKS。服务器只接受外网流量，所以 MYDESK 上 hub 地址必须在 Clash 里
# 走固定代理节点（docs/DSH-HUB-PROTOCOL-v2.md 第 8 节）。http:// 回环 hub 永不走代理。
# 代理不通 / CONNECT 被拒 / TLS 失败 / 超时 -> 503 hub-unreachable，并写明哪一步失败。
#
# .env 格式：每行 KEY=value；# 开头是注释；支持 export 前缀和 '...' / "..." 引号；未加引号
# 的值里“空格+#”之后是注释；KEY= 留空等于没配；同名键以最后一行为准；文件不存在则跳过。
# 权限：文件里有令牌。POSIX: chmod 600；Windows 放在自己的用户目录下即可。
#
# v1 的键（dataDir, publicUrl, offlineAfterMs, sweepIntervalMs, maxRetries,
# maxPendingRequests, maxResultBytes）会被忽略并告警：它们现在属于 hub 机器上的
# <DSH home>/agent-hub/hub.json。

- insert:
    - id: host-agent-hub
      name: dsh-host-agent-hub
      config:
        # hubUrl / controllerId / proxy / caFile 故意不写：从 <DSH home>/agent-hub/controller.env 读取
        timeoutMs: 15000
        tokenEnv: DSH_HUB_TOKEN
        # envFile: /root/.dsh/agent-hub/controller.env  # 默认就是 <DSH home>/agent-hub/controller.env（绝不能是 <DSH home>/.env）
    - id: client-ui-agent-hub
      name: dsh-client-ui-agent-hub
