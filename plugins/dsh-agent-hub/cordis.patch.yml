# dsh-agent-hub — bundle patch layer (protocol dsh-agent/2.0, docs/DSH-HUB-PROTOCOL-v2.md)
#
# This DSH is a CONTROLLER of the standalone dsh-hub service (services/dsh-hub,
# port 7891, see services/dsh-hub/README.md). The hub owns tasks, leases, retries
# and artifacts; this plugin keeps no task state and runs no sweeper. Workers
# (AWS Quick, Claude Code, Kiro, ...) connect to the hub directly, never to DSH.
#
#   host-agent-hub        the 11 DSH-only control tools (-> hub /v1/ctl/*) and the
#                         login-guarded read-only panel routes /api/agent-hub/admin/*
#                         (forwarded to the hub, same paths and fields as v1)
#   client-ui-agent-hub   the read-only "Agent" tab of the router-b task board (falls back to a Sidebar
#                         row + full page only when router-b is not loaded); its
#                         host half is empty. lib/client.js must be built on the server:
#                         node packages/client-ui-agent-hub/scripts/build-client.mjs
#
# Tools (registered for DSH only):
#   agent_provision / agent_revoke / agent_list
#   agent_requests / agent_approve / agent_reject      (enrollment: worker asks, a controller decides)
#   task_dispatch / task_list / task_get / task_cancel / task_retry
#
# HTTP on the DSH web server (DSH login, GET only):
#   /api/agent-hub/admin/overview | agents | tasks?status=&agent=&limit= | task?task_id= | requests?status=
#   hub down / refused / TLS error / timeout  -> 503 {error:{code:"hub-unreachable"}}
#   hub refuses the controller token           -> 502 {error:{code:"hub-unauthorized"}}
#
# ---------------------------------------------------------------------------------------
# config (host-agent-hub)
#
#   hubUrl        Base URL of the hub. https://<hub-host>:7891 for a remote hub;
#                 http:// is accepted ONLY for 127.0.0.1 / localhost / [::1] (a hub
#                 without TLS only listens on loopback). No credentials, query or
#                 fragment. A path prefix is kept (https://proxy/hub -> /hub/v1/ctl/...).
#                 Default: none (required). Example below: hub on this same machine.
#   controllerId  This DSH's controller id on the hub, /^[a-z][a-z0-9-]{1,47}$/,
#                 e.g. dsh-cloud or dsh-local. Sent as ?id=<controllerId> on every
#                 request. Default: none (required).
#   caFile        PEM file of the hub's (self-signed) certificate or its CA. When set,
#                 it is the ONLY trust anchor for the hub (passed as `ca` to
#                 node:https request); when unset, the system CAs are used.
#                 Only for https:// hubUrl. Default: unset.
#   timeoutMs     Per-request timeout towards the hub, integer 1000..120000.
#                 Default: 15000 (an invalid value warns and uses the default).
#   tokenEnv      NAME of the variable holding the controller token, used both for the
#                 process environment and for the .env file. Default: DSH_HUB_TOKEN.
#   envFile       .env file read when the process environment has no <tokenEnv>.
#                 Default: <DSH home>/.env, where DSH home = $DSH_HOME or ~/.dsh.
#   proxy         How this DSH reaches an https:// hub. Node's https.request ignores
#                 HTTPS_PROXY, so the plugin opens the tunnel itself: CONNECT <hub>:<port>
#                 on the proxy, then TLS to the hub (hostname checked, caFile applies)
#                 inside it. The token travels only inside that TLS tunnel.
#                   unset / off    direct connection (DEFAULT)
#                   http://h:p     always this HTTP proxy; http://user:pass@h:p sends
#                                  Proxy-Authorization: Basic (credentials are never
#                                  logged or shown in errors). Only http:// proxies, no SOCKS.
#                   env            HTTPS_PROXY, https_proxy, HTTP_PROXY, http_proxy (first
#                                  set wins, read on every call), unless NO_PROXY / no_proxy
#                                  matches the hub host (comma separated: host, .suffix,
#                                  *.suffix, host:port, or * for everything; no CIDR).
#                 Examples: dsh-local on MYDESK -> proxy: http://127.0.0.1:7890 (Clash /
#                 mihomo; the server only accepts outside traffic, so the hub address must
#                 go through a fixed proxy node in Clash, see docs/DSH-HUB-PROTOCOL-v2.md
#                 section 8); dsh-cloud on the hub machine -> hubUrl https://127.0.0.1:7891 + caFile (http:// only when the hub runs without TLS),
#                 no proxy (an http:// loopback hub is never proxied; a proxy set there
#                 is ignored with a warning). Proxy down / CONNECT refused / TLS failure
#                 / timeout -> 503 hub-unreachable naming the failed step.
#
# Controller token (dshc_<controllerId>_<random>), looked up on EVERY call, so a rotated
# token is picked up without a restart:
#   1. process environment variable <tokenEnv>                  (wins if non-empty)
#   2. the <tokenEnv>=... line of <envFile>                     (fallback)
#   Neither found -> the plugin still loads, logs a warning, and every tool / panel call
#   answers hub-token-missing. A token of another controller -> hub-token-mismatch.
#   Issue it ON THE HUB MACHINE (shown once):  node server.mjs controller add dsh-cloud
#   The token is sent only in the X-DSH-Token header, never in the URL, and is never
#   written to logs, tool outputs or panel responses (only its source is logged).
#
# .env format (one KEY=value per line; no third-party parser):
#     # dsh-hub controller token for this DSH      <- comment line
#     DSH_HUB_TOKEN=dshc_dsh-cloud_xxxxxxxxxxxxxxxx
#     export DSH_HUB_TOKEN="dshc_dsh-cloud_xxxx"    # `export ` prefix ignored, '...' or "..." optional
#   - blank lines and lines starting with # are ignored; ` #` after an unquoted value
#     starts a comment; quoted values are literal; malformed lines are skipped;
#     the last definition of a key wins;
#   - a missing file is skipped silently;
#   - permissions: the file holds a secret. chmod 600 <envFile> (owner read/write
#     only). On POSIX a file readable by group or others is still used but logs a
#     warning; on Windows keep it in your user profile (default ACL is owner-only).
#
# v1 keys (dataDir, publicUrl, offlineAfterMs, sweepIntervalMs, maxRetries,
# maxPendingRequests, maxResultBytes) are ignored with a warning: they now live in the
# hub's own <DSH home>/agent-hub/hub.json on the hub machine.

- insert:
    - id: host-agent-hub
      name: dsh-host-agent-hub
      config:
        hubUrl: https://127.0.0.1:7891  # dsh-cloud next to a TLS hub (cert SAN must include 127.0.0.1; http:// only if the hub has no TLS); remote hub: https://<hub-host>:7891 (+ caFile if self-signed)
        controllerId: dsh-cloud         # dsh-local on the workstation
        # caFile: /root/.dsh/agent-hub/hub-ca.pem
        timeoutMs: 15000
        tokenEnv: DSH_HUB_TOKEN
        # envFile: /root/.dsh/.env      # default: <DSH home>/.env
        # proxy: http://127.0.0.1:7890  # dsh-local on MYDESK (Clash/mihomo); default: unset = direct; or: env
    - id: client-ui-agent-hub
      name: dsh-client-ui-agent-hub
