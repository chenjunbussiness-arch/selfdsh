# 脱敏模板（sanitized template）—— 2026-11-21 从 /etc/nginx/sites-available/couple-fit 复制。
# 已替换：server_name / TLS 证书与私钥路径 / 客户端 CA / basic-auth 口令文件路径 / 站点 root。
# 占位符：__SERVER_NAME__ __TLS_CERT__ __TLS_KEY__ __CLIENT_CA__ __HTPASSWD_FILE__ __SITE_ROOT__
# 原文件里的真实主机名、证书文件名与站点绝对路径不在本仓库出现。

# couple-fit — 静态「情侣契合度测试」单页工具站（独立站点）
# 新增于 2026-11-21，任务 t20261120193031-321。
# 只新增本文件与 sites-enabled 软链；不触碰 8443 / 8444 / 8445 与 80 / 443 的任何现有站点。
server {
    listen 8450;
    server_name _;

    charset utf-8;
    charset_types text/css application/javascript application/json image/svg+xml text/plain;

    gzip on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # root 直接指向页面目录（路径含空格，用引号包裹；已实测可用）
    root "__SITE_ROOT__";
    index index.html;

    autoindex off;
    add_header X-Content-Type-Options nosniff always;

    # 静态资源：长缓存（30 天）
    location ~* \.(?:css|js|svg|png|jpe?g|webp|ico|woff2?)$ {
        try_files $uri =404;
        expires 30d;
        add_header X-Content-Type-Options nosniff always;
    }

    # HTML：不缓存，保证改动立即可见
    location ~* \.html?$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # 页面本体：目录/路由都回落到 index.html
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options nosniff always;
    }
}
