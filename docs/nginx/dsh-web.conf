# 脱敏模板（sanitized template）—— 2026-11-21 从 /etc/nginx/sites-available/dsh-web 复制。
# 已替换：server_name / TLS 证书与私钥路径 / 客户端 CA / basic-auth 口令文件路径 / 站点 root。
# 占位符：__SERVER_NAME__ __TLS_CERT__ __TLS_KEY__ __CLIENT_CA__ __HTPASSWD_FILE__ __SITE_ROOT__
# 原文件里的真实主机名、证书文件名与站点绝对路径不在本仓库出现。

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# DSH 手机兼容 polyfill：页面类请求清掉上游 Accept-Encoding，让 sub_filter 能匹配明文 HTML；
# /api/、/plugins/ 及带扩展名的静态资源保持上游压缩不变。
map $uri $dsh_upstream_ae {
    default                 "";
    ~^/api/                 $http_accept_encoding;
    ~^/plugins/             $http_accept_encoding;
    ~\.[A-Za-z0-9]+$        $http_accept_encoding;
}

server {
    listen 8443 ssl;
    server_name __SERVER_NAME__;

    ssl_certificate     /etc/nginx/tls/__TLS_CERT__;
    ssl_certificate_key /etc/nginx/tls/__TLS_KEY__;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;

    # 明文 http 打到 8443 时自动跳到 https
    error_page 497 =301 https://$host:$server_port$request_uri;

    proxy_http_version 1.1;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host       $http_host;
    proxy_set_header X-Real-IP  $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout  3600s;
    proxy_send_timeout  3600s;
    proxy_buffering     off;

    client_max_body_size 512m;

    # 固定账号密码：这是"进页面的 key"，永不轮换。
    # DSH 自己的 launch token 由后面的 gate 自动补上，你不需要再管它。
    # LLM API：不走 Basic 认证，由后端自己的 Bearer key 鉴权
    location /llm/kiro/ {
        proxy_pass http://127.0.0.1:7993/;
        proxy_set_header Authorization $http_authorization;
    }
    location /llm/gemini/ {
        proxy_pass http://127.0.0.1:4000/;
        proxy_set_header Authorization $http_authorization;
    }

    # 旧版 Chromium(107) 缺 AbortSignal.any / Promise.withResolvers 等，由此 polyfill 补齐
    location = /__dsh-polyfill.js {
        auth_basic           "DSH";
        auth_basic_user_file /etc/nginx/__HTPASSWD_FILE__;
        alias /etc/nginx/dsh-polyfill.js;
        default_type application/javascript;
        types { }
        add_header Cache-Control "no-cache" always;
    }

    # dsh-fileshare 的临时链接：链接本身就是凭证（随机令牌 + 过期 + 可撤销），
    # 所以这两条不走 Basic 认证，好让手机、别的电脑、curl 直接下载 / 上传。
    # 必须直连 dsh web（42443），不能经过 42444 的 gate：gate 会替没登录的浏览器补上
    # DSH 的 launch token，经过它等于把 DSH 登录送给拿到链接的人。
    # 只放这两个前缀；/api/fileshare 下的其它接口（列表、生成、撤销）仍在 location / 里要登录。
    location ^~ /api/fileshare/d/ {
        limit_except GET HEAD { deny all; }
        proxy_pass http://127.0.0.1:42443;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header Accept-Encoding   "";
    }
    location ^~ /api/fileshare/u/ {
        limit_except GET HEAD PUT POST { deny all; }
        client_max_body_size    4096m;   # 不小于 dsh-fileshare 的 uploadMaxMbCap
        proxy_request_buffering off;     # 边收边写，不在 nginx 落临时文件
        proxy_pass http://127.0.0.1:42443;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP         $remote_addr;
    }

    location / {
        auth_basic           "DSH";
        auth_basic_user_file /etc/nginx/__HTPASSWD_FILE__;
        proxy_pass http://127.0.0.1:42444;
        # location 内一旦设置 proxy_set_header 就不再继承 server 级，故在此重复
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host       $http_host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Accept-Encoding $dsh_upstream_ae;
        # sub_filter_types 默认即 text/html，无需再写（写了会报 duplicate MIME 警告）
        sub_filter_once  on;
        sub_filter '<head>' '<head><script src="/__dsh-polyfill.js"></script>';
    }
}
