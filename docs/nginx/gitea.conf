# 脱敏模板（sanitized template）—— 2026-11-21 从 /etc/nginx/sites-available/gitea 复制。
# 已替换：server_name / TLS 证书与私钥路径 / 客户端 CA / basic-auth 口令文件路径 / 站点 root。
# 占位符：__SERVER_NAME__ __TLS_CERT__ __TLS_KEY__ __CLIENT_CA__ __HTPASSWD_FILE__ __SITE_ROOT__
# 原文件里的真实主机名、证书文件名与站点绝对路径不在本仓库出现。

server {
    listen 8444 ssl;
    server_name __SERVER_NAME__;

    ssl_certificate     /etc/nginx/tls/__TLS_CERT__;
    ssl_certificate_key /etc/nginx/tls/__TLS_KEY__;
    ssl_protocols TLSv1.2 TLSv1.3;

    ssl_client_certificate /etc/nginx/tls/__CLIENT_CA__;
    ssl_verify_client on;
    ssl_verify_depth 2;

    error_log /var/log/nginx/gitea-8444-error.log info;

    client_max_body_size 512m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
