# 脱敏模板（sanitized template）—— 2026-11-21 从 /etc/nginx/sites-available/browser-novnc 复制。
# 已替换：server_name / TLS 证书与私钥路径 / 客户端 CA / basic-auth 口令文件路径 / 站点 root。
# 占位符：__SERVER_NAME__ __TLS_CERT__ __TLS_KEY__ __CLIENT_CA__ __HTPASSWD_FILE__ __SITE_ROOT__
# 原文件里的真实主机名、证书文件名与站点绝对路径不在本仓库出现。

# noVNC 对外入口（独立站点，端口 8445 ssl）
# 后端：websockify --web /usr/share/novnc 127.0.0.1:6080 localhost:5900
# 说明：本文件与 8443(dsh-web)/8444(gitea) 完全独立，互不影响。

# WebSocket upgrade 映射。故意用独立变量名，
# 避免与 dsh-web 里已定义的 $connection_upgrade 冲突（重复 map 会导致 nginx -t 失败）。
map $http_upgrade $novnc_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8445 ssl;
    server_name __SERVER_NAME__;

    # 复用现有证书
    ssl_certificate     /etc/nginx/tls/__TLS_CERT__;
    ssl_certificate_key /etc/nginx/tls/__TLS_KEY__;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL_novnc:10m;

    # 明文 http 打到 8445 时自动跳到 https
    error_page 497 =301 https://$host:$server_port$request_uri;

    access_log /var/log/nginx/browser-novnc.access.log;
    error_log  /var/log/nginx/browser-novnc.error.log;

    # 整个站点都需要 basic auth（含重定向与静态资源）
    auth_basic           "noVNC";
    auth_basic_user_file /etc/nginx/__HTPASSWD_FILE__;

    client_max_body_size 64m;

    # 根路径直接按 /vnc.html 渲染（内部代理，不做 302），
    # 这样 https://host:8445/ 本身就是可用的 noVNC 页面并自动连接。
    location = / {
        proxy_pass http://127.0.0.1:6080/vnc.html?autoconnect=1&resize=remote&path=websockify;
    }

    # noVNC 静态资源 + websockify 的 /websockify WebSocket 端点
    location / {
        proxy_pass http://127.0.0.1:6080;

        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $novnc_connection_upgrade;
        proxy_set_header Host       $http_host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # VNC 长连接
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        proxy_buffering     off;
        proxy_connect_timeout 10s;
    }
}
