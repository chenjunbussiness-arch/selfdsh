          - id: kiro/claude-haiku-5.5
            name: kiro/claude-haiku-5.5
            contextWindow: 1000000
            maxTokens: 328000
            input:
              - text
              - image
            reasoningEfforts:
              off: null
              low: low
              medium: medium
