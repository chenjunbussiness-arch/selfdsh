# ⚠ 脱敏副本 —— 2026-11-21 从 /root/.dsh/profiles/web/cordis.patch.yml 复制。
# 本文件不含任何真实凭据：源文件中没有字面 API key / token / 口令；
# 唯一出现过的凭据占位值 `exa-proxy-local`（EXA_PROXY_TOKEN 在凭据库里的值）已替换为 __REPLACE_ME__。
# 各 provider 的 apiKeyEnv（DEEPSEEK_API_KEY / KIRO_API_KEY / GEMINI_GATEWAY_KEY）只是环境变量名，
# 值请在新机的 /root/.dsh/.credentials.yaml 或 /root/.dsh/.env 里重新录入。
# 路径类（分区根、vendor/exa-mcp-server）按 docs/README-MIGRATE.md 第 3 节改。

# Your patch layer for this dsh profile, applied after every bundle layer:
# a top-level YAML array of loader patch entries (id-targeted config
# overrides, disables, and insert lists; `!!js` expressions allowed).
- id: ui-settings-general
  name: "@deepseek-ai/dsh-client-ui-settings-general"
  config:
    welcomeNoticeVersion: 2026-09-28.1

# commandcode 走 OpenAI-completions 协议，不是 DeepSeek 原生协议。
# 必须关掉 developer role（它只收 user/assistant）并用 deepseek 的 thinking 格式，
# 否则上游会回 "Invalid discriminator value ... messages.N.role" /
# "Invalid input at thinking"。
- id: llm-pi-ai
  name: "@deepseek-ai/dsh-llm-pi-ai"
  config:
    providers:
      commandecode:
        displayName: commandecode
        apiKeyEnv: DEEPSEEK_API_KEY
        api: openai-completions
        baseURL: https://api.commandcode.ai/provider/v1
        reasoning: max
        compat:
          thinkingFormat: deepseek
          supportsStore: false
          supportsDeveloperRole: false
          maxTokensField: max_tokens
        models:
          - id: deepseek/deepseek-v4.1-flash
            name: DSV4.1
            contextWindow: 1000000
            maxTokens: 384000
            input:
              - text
              - image
            reasoningEfforts:
              off: null
              low: low
              high: high
              max: max

      kiro:
        displayName: kiro
        api: openai-completions
        apiKeyEnv: KIRO_API_KEY
        baseURL: http://127.0.0.1:7993/v1
        reasoning: high
        models:
          - id: kiro/claude-opus-5.5
            name: kiro/claude-opus-5.5
            contextWindow: 1000000
            maxTokens: 328000
            input:
              - text
              - image
            reasoningEfforts:
              off: null
              low: low
              medium: medium
              high: high
              xhigh: xhigh
              max: max
          - id: kiro/claude-sonnet-5.5
            name: kiro/claude-sonnet-5.5
            contextWindow: 1000000
            maxTokens: 328000
            input:
              - text
              - image
            reasoningEfforts:
              off: null
              low: low
              medium: medium
              high: high
